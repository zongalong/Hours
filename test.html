<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1013">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Heures">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Heures (test)</title>
<style>
:root{--bg:#0e1013;--surf:#171a1f;--line:#262b33;--tx:#e8eaee;--mut:#8a919c;--acc:#7cb4ff;--rec:#ff5252;color-scheme:dark}
:root[data-theme=light]{--bg:#f4f5f7;--surf:#fff;--line:#dfe2e7;--tx:#14171c;--mut:#667085;--acc:#1f6feb;--rec:#e5303a;color-scheme:light}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f4f5f7;--surf:#fff;--line:#dfe2e7;--tx:#14171c;--mut:#667085;--acc:#1f6feb;--rec:#e5303a;color-scheme:light}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px);max-width:560px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.02em}
.ghost{background:none;border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px}
.clock{background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:24px 20px;text-align:center}
.time{font-size:56px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--mut);transition:color .2s}
.on .time{color:var(--tx)}
.state{display:flex;justify-content:center;align-items:center;gap:8px;color:var(--mut);font-size:14px;height:20px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.run .dot{background:var(--rec);animation:p 1.4s ease-in-out infinite}
@keyframes p{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.run .dot{animation:none}}
input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:13px 14px;font:inherit;margin-top:10px}
input:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.go{width:100%;margin-top:16px;border:0;border-radius:16px;padding:18px;font:inherit;font-size:18px;font-weight:600;background:var(--acc);color:#06121f}
.btns{display:flex;gap:10px;margin-top:16px}.btns .go{margin-top:0;flex:1}.on #go{background:var(--bg);border:1px solid var(--line);color:var(--tx)}.paused #go{background:var(--acc);border:0;color:#06121f}#fin{background:var(--rec);color:#fff}.paused .dot{background:#f5a524}
.go:active{transform:scale(.98)}
.sum{display:flex;gap:10px;margin:20px 0 6px}
.sum div{flex:1;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px}
.sum b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.sum span,.day span{color:var(--mut);font-size:13px}
.day{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 8px;font-weight:600}
.row{display:flex;justify-content:space-between;gap:12px;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.row p{margin:0}.row small{color:var(--mut)}
.row .d{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.row button{background:none;border:0;color:var(--mut);font-size:13px;padding:2px 0}
.empty{color:var(--mut);text-align:center;margin-top:30px}
.hb{display:flex;gap:8px}.adj{width:100%;margin-top:12px}
.row{cursor:pointer}.row:active{background:var(--bg)}
dialog{border:1px solid var(--line);background:var(--surf);color:var(--tx);border-radius:22px;padding:20px;width:min(92vw,520px);margin:auto auto calc(env(safe-area-inset-bottom) + 12px)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{margin:0 0 4px;font-size:19px}
dialog label{display:block;color:var(--mut);font-size:13px;margin-top:12px}
dialog input{margin-top:6px;min-height:46px;text-align:left}
dialog [hidden]{display:none!important}
#e-sum{color:var(--mut);font-size:14px;margin:14px 0 0;min-height:20px}
.btns .ghost{flex:1;padding:16px;font-size:16px}
.del{width:100%;margin-top:10px;color:var(--rec)}
.hint{color:var(--mut);font-size:13px;margin:16px 4px 0}
.errb{background:#3a1518;border:1px solid var(--rec);color:#ffd7d7;border-radius:12px;padding:12px;margin-bottom:14px;font-size:13px;word-break:break-word}.hint a{color:var(--acc)}
@font-face{font-family:Figtree;font-weight:400;src:url(figtree-400.woff2) format("woff2");font-display:swap}
@font-face{font-family:Figtree;font-weight:700;src:url(figtree-700.woff2) format("woff2");font-display:swap}
select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font:inherit;margin-top:10px;min-height:46px}
dialog{max-height:88vh;overflow:auto}
dialog select{margin-top:6px}
.tabs{display:flex;gap:6px;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-size:15px;padding:10px;border-radius:10px}
.tabs .on{background:var(--bg);color:var(--tx);font-weight:600}
.chk{display:flex;gap:12px;align-items:center;color:var(--tx);font-size:15px;padding:8px 0;border-bottom:1px solid var(--line)}
.chk input{width:22px;height:22px;min-height:0;margin:0;flex:none}
.chk small{color:var(--mut)}
#i-sum{color:var(--mut);font-size:14px;margin:14px 0 0;min-height:20px}
#pv{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:50;padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 24px)}
.pvbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px;max-width:760px;margin-left:auto;margin-right:auto}
.pvbar .go{width:auto;margin:0;padding:12px 16px;font-size:15px;border-radius:12px;flex:none}
.sheet{max-width:760px;margin:0 auto 14px;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.4)}
.sheet svg{display:block;width:100%;height:auto}
#pv .del{max-width:760px;display:block;margin:8px auto 0}
#printArea{display:none}
@media print{
  :root{color-scheme:light}
  @page{size:letter;margin:0}
  html,body{background:#fff!important;padding:0!important;margin:0!important;max-width:none!important}
  body>*{display:none!important}
  body>#printArea{display:block!important}
  #printArea .pg{width:8.5in;height:11in;overflow:hidden;break-after:page;page-break-after:always}
  #printArea .pg:last-child{break-after:auto;page-break-after:auto}
  #printArea svg{display:block;width:8.5in;height:11in}
}
</style>
</head>
<body>
<header><h1>Heures <small style="font-size:12px;color:var(--rec);border:1px solid var(--rec);border-radius:6px;padding:1px 6px;vertical-align:middle">TEST</small></h1><div class="hb"><button class="ghost" id="add">+ Entrée</button></div></header>
<div id="err" class="errb" hidden></div>
<main id="app">
  <nav class="tabs" id="tabs"><button data-v="h" class="on">Heures</button><button data-v="f">Factures</button><button data-v="c">Clients</button></nav>
  <div id="v-h">
  <section class="clock" id="clock">
    <div class="time" id="time">00:00:00</div>
    <div class="state"><i class="dot"></i><span id="st">Prêt</span></div>
    <input id="client" list="cl" placeholder="Client ou projet" autocomplete="off">
    <datalist id="cl"></datalist>
    <select id="pos" aria-label="Poste"></select>
    <div id="pos-c" hidden><input id="pos-n" placeholder="Nom du poste" autocomplete="off"><input id="pos-r" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Taux horaire ($/h)"></div>
    <input id="note" placeholder="Note (optionnel)" autocomplete="off">
    <button class="ghost adj" id="adj" hidden>Ajuster l'heure de début</button>
    <div class="btns"><button class="go" id="go">Démarrer</button><button class="go" id="fin" hidden>Terminer</button></div>
  </section>
  <div class="sum"><div><b id="t1">0h00</b><span>Aujourd'hui</span></div><div><b id="t2">0h00</b><span>Cette semaine</span></div></div>
  <div id="hist"></div>
  <div class="hb" style="margin-top:16px"><button class="ghost" id="exp">Exporter CSV</button></div>
  <p class="hint"><a href="#" id="raw">Exporter les données brutes (JSON)</a></p>
  </div>
  <section id="v-f" hidden>
    <div class="btns" style="margin-top:0"><button class="go" id="nf">Nouvelle facture</button><button class="ghost" id="prof">Mon profil</button></div>
    <div id="finv" style="margin-top:18px"></div>
  </section>
  <section id="v-c" hidden>
    <div class="btns" style="margin-top:0"><button class="go" id="nc">+ Client</button></div>
    <div id="fcl" style="margin-top:18px"></div>
  </section>
</main>
<dialog id="dlg"><div>
  <h2 id="dt">Modifier</h2>
  <label>Début<input type="datetime-local" id="e-s"></label>
  <label id="l-e">Fin<input type="datetime-local" id="e-e"></label>
  <label id="l-p">Pause (minutes)<input type="number" id="e-p" min="0" inputmode="numeric"></label>
  <label>Client ou projet<input id="e-c" list="cl" autocomplete="off"></label>
  <label>Poste<select id="e-pos"></select></label>
  <div id="e-pos-c" hidden><input id="e-pos-n" placeholder="Nom du poste" autocomplete="off"><input id="e-pos-r" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Taux horaire ($/h)"></div>
  <label>Kilométrage (km, optionnel)<input id="e-km" type="number" inputmode="decimal" min="0" step="0.1" placeholder="Ex. 120"></label>
  <label>Note<input id="e-n" autocomplete="off"></label>
  <p id="e-sum"></p>
  <div class="btns"><button type="button" class="ghost" id="e-x">Annuler</button><button type="button" class="go" id="e-ok">Enregistrer</button></div>
  <button type="button" class="ghost del" id="e-d">Supprimer cette entrée</button>
</div></dialog>
<dialog id="cdlg"><div><h2 id="c-t">Client</h2>
  <label>Entreprise<input id="c-name" autocomplete="off"></label>
  <label>Personne-ressource / propriétaire<input id="c-contact" autocomplete="off"></label>
  <label>Adresse<input id="c-a1" placeholder="Rue" autocomplete="off"><input id="c-a2" placeholder="Ville, province, code postal" autocomplete="off"><input id="c-a3" placeholder="Pays (optionnel)" autocomplete="off"></label>
  <label>Courriel<input id="c-email" type="email" inputmode="email" autocomplete="off"></label>
  <label>Téléphone<input id="c-phone" type="tel" autocomplete="off"></label>
  <div class="btns"><button type="button" class="ghost" id="c-x">Annuler</button><button type="button" class="go" id="c-ok">Enregistrer</button></div>
  <button type="button" class="ghost del" id="c-d">Supprimer ce client</button>
</div></dialog>
<dialog id="pdlg"><div><h2>Mon profil</h2>
  <p class="hint" style="margin:4px 0 0">Ce bloc s'affiche en haut à droite de tes factures.</p>
  <label>Nom<input id="p-name" autocomplete="off"></label>
  <label>Adresse<input id="p-a1" placeholder="Rue" autocomplete="off"><input id="p-a2" placeholder="Ville, province, code postal" autocomplete="off"><input id="p-a3" placeholder="Pays" autocomplete="off"></label>
  <div class="btns"><button type="button" class="ghost" id="p-x">Annuler</button><button type="button" class="go" id="p-ok">Enregistrer</button></div>
</div></dialog>
<dialog id="idlg"><div><h2>Nouvelle facture</h2>
  <label>Client<select id="i-cl"></select></label>
  <label>Numéro de facture<input id="i-no" type="number" inputmode="numeric" min="1"></label>
  <label>Date de facture<input id="i-d" type="date"></label>
  <label>Échéance<input id="i-due" type="date"></label>
  <label>Arrondi des heures<select id="i-rnd"><option value="0.25">Au quart d'heure</option><option value="0.01">Exact (à la minute près)</option></select></label>
  <label>Entrées à facturer</label>
  <div id="i-list"></div>
  <label class="chk" id="i-kmw" hidden><input type="checkbox" id="i-km"><span>Facturer le kilométrage<br><small id="i-kmt"></small></span></label>
  <label id="i-kmrw" hidden>Taux au km ($)<input id="i-kmr" type="number" inputmode="decimal" step="0.01" value="0.67"></label>
  <p id="i-sum"></p>
  <div class="btns"><button type="button" class="ghost" id="i-x">Annuler</button><button type="button" class="go" id="i-ok">Créer la facture</button></div>
</div></dialog>
<div id="pv" hidden>
  <div class="pvbar"><button class="ghost" id="pv-x">Fermer</button><b id="pv-t"></b><button class="go" id="pv-pr">PDF / Imprimer</button></div>
  <div id="pv-p"></div>
  <button class="ghost del" id="pv-d">Supprimer cette facture</button>
</div>
<div id="printArea"></div>
<script>
const K='heures.v1';
let S={logs:[],run:null};
let RAW=null,bad=0;
try{RAW=localStorage.getItem(K);S=Object.assign(S,JSON.parse(RAW||'{}'))}catch(e){}
if(!Array.isArray(S.logs))S.logs=[];
const n0=S.logs.length;
S.logs=S.logs.filter(l=>l&&+l.start>0&&+l.end>0).map(l=>Object.assign({},l,{id:l.id||Math.random().toString(36).slice(2),start:+l.start,end:+l.end}));
bad=n0-S.logs.length;
if(S.run&&!(+S.run.start>0)){S.run=null;bad++}
if(bad&&RAW){try{localStorage.setItem(K+'.backup',RAW)}catch(e){}}
function showErr(m){const b=document.getElementById('err');b.hidden=false;b.textContent=m}
window.addEventListener('error',e=>showErr('Erreur : '+e.message))
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const work=r=>r?(r.paused||Date.now())-r.start-(r.pt||0):0;
const dur=l=>l.work!=null?l.work:l.end-l.start;
const pad=n=>String(n).padStart(2,'0');
const hms=ms=>{const s=Math.floor(ms/1e3);return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)};
const hm=ms=>{const m=Math.round(ms/6e4);return Math.floor(m/60)+'h'+pad(m%60)};
const dkey=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function weekStart(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()}
function render(){try{render0()}catch(e){showErr("Erreur d'affichage : "+e.message)}}
function render0(){
  const r=S.run;
  $('clock').classList.toggle('run',!!r&&!r.paused);
  $('clock').classList.toggle('on',!!r);
  $('clock').classList.toggle('paused',!!(r&&r.paused));
  $('go').textContent=!r?'Démarrer':r.paused?'Reprendre':'Pause';
  $('fin').hidden=!r;$('adj').hidden=!r;
  $('st').textContent=r?(r.paused?'En pause':'En cours')+(r.client?' · '+r.client:''):'Prêt';
  $('client').disabled=$('note').disabled=!!r;
  const cl=[...new Set([...(S.clients||[]).map(c=>c.name),...S.logs.map(l=>l.client)].filter(Boolean))];
  $('cl').innerHTML=cl.map(c=>'<option value="'+esc(c)+'">').join('');
  const today=dkey(Date.now()),ws=weekStart();
  let t1=0,t2=0;S.logs.forEach(l=>{const d=dur(l);if(dkey(l.start)===today)t1+=d;if(l.start>=ws)t2+=d});
  $('t1').textContent=hm(t1);$('t2').textContent=hm(t2);
  const g={};[...S.logs].sort((a,b)=>b.start-a.start).forEach(l=>(g[dkey(l.start)]=g[dkey(l.start)]||[]).push(l));
  const fmt=new Intl.DateTimeFormat('fr-CA',{weekday:'long',day:'numeric',month:'long'});
  const tf=t=>new Date(t).toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'});
  $('hist').innerHTML=(S.logs.length?'<p class="hint">Touche une entrée pour la modifier.</p>':'')+Object.keys(g).map(k=>{
    const tot=g[k].reduce((a,l)=>a+dur(l),0);
    return '<div class="day"><div>'+esc(fmt.format(new Date(g[k][0].start)))+'</div><span>'+hm(tot)+'</span></div>'+
    g[k].map(l=>'<div class="row" data-id="'+l.id+'"><div><p>'+esc(l.client||'Sans client')+'</p><small>'+tf(l.start)+' – '+tf(l.end)+(l.pos?' · '+esc(l.pos):' · sans poste')+(l.km?' · '+l.km+' km':'')+(l.note?' · '+esc(l.note):'')+(l.inv?' · facture '+esc(l.inv):'')+'</small></div><div class="d">'+hm(dur(l))+'</div></div>').join('')
  }).join('')||'<p class="empty">Aucune entrée. Appuie sur Démarrer pour lancer ta première session.</p>';
  if(typeof afterRender==='function')afterRender();
}
function tick(){$('time').textContent=hms(work(S.run))}
$('go').onclick=()=>{
  const r=S.run,now=Date.now();
  if(!r){const p=pickPos('pos',true);if(!p)return;S.run={start:now,client:$('client').value.trim(),note:$('note').value.trim(),pos:p.title,rate:p.rate,pt:0,paused:null}}
  else if(r.paused){r.pt=(r.pt||0)+now-r.paused;r.paused=null}
  else r.paused=now;
  save();render();tick();
};
$('fin').onclick=()=>{
  const r=S.run;if(!r)return;
  const now=Date.now(),w=work(r);
  S.logs.push({id:now.toString(36),start:r.start,end:now,work:w,client:r.client,note:r.note,pos:r.pos,rate:r.rate,km:r.km});
  S.run=null;$('note').value='';save();render();tick();
};
let E=null;
const loc=t=>{const d=new Date(t);return dkey(t)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
const val=id=>new Date($(id).value).getTime();
function upd(){
  const st=val('e-s');let t='';
  if(!isNaN(st)){
    if(E.mode==='run')t='Temps travaillé : '+hm(work(Object.assign({},S.run,{start:st})));
    else{const w=val('e-e')-st-(+$('e-p').value||0)*6e4;t=w>0?'Temps travaillé : '+hm(w):'La fin doit être après le début'}
  }
  $('e-sum').textContent=t;
}
function openDlg(mode,id){
  E={mode,id};
  $('l-e').hidden=$('l-p').hidden=mode==='run';
  $('e-d').hidden=mode!=='log';
  $('dt').textContent=mode==='run'?"Ajuster l'heure de début":mode==='new'?'Nouvelle entrée':"Modifier l'entrée";
  if(mode==='log'){const l=S.logs.find(x=>x.id===id);$('e-s').value=loc(l.start);$('e-e').value=loc(l.end);$('e-p').value=Math.max(0,Math.round((l.end-l.start-dur(l))/6e4));$('e-c').value=l.client||'';$('e-n').value=l.note||''}
  else if(mode==='run'){$('e-s').value=loc(S.run.start);$('e-c').value=S.run.client||'';$('e-n').value=S.run.note||''}
  else{const n=Date.now();$('e-s').value=loc(n-36e5);$('e-e').value=loc(n);$('e-p').value=0;$('e-c').value='';$('e-n').value=''}
  const cur=mode==='log'?S.logs.find(x=>x.id===id):mode==='run'?S.run:null;
  fillPos('e-pos',cur&&cur.pos?cur:null);$('e-km').value=(cur&&cur.km)||'';
  upd();$('dlg').showModal();
}
['e-s','e-e','e-p'].forEach(i=>$(i).oninput=upd);
$('add').onclick=()=>openDlg('new');
$('adj').onclick=()=>openDlg('run');
$('hist').onclick=e=>{const r=e.target.closest('.row');if(r)openDlg('log',r.dataset.id)};
$('e-x').onclick=()=>$('dlg').close();
$('e-d').onclick=()=>{if(confirm('Supprimer cette entrée?')){S.logs=S.logs.filter(x=>x.id!==E.id);$('dlg').close();save();render()}};
$('e-ok').onclick=()=>{
  const st=val('e-s'),c=$('e-c').value.trim(),n=$('e-n').value.trim();
  if(isNaN(st))return alert('Heure de début invalide');
  const cur0=E.mode==='log'?S.logs.find(x=>x.id===E.id):null;
  const pk=pickPos('e-pos',E.mode!=='log'||!!(cur0&&cur0.pos));if(!pk)return;
  const kmv=parseFloat($('e-km').value);const pp=Object.assign(pk.empty?{}:{pos:pk.title,rate:pk.rate},{km:kmv>0?kmv:undefined});
  if(E.mode==='run'){
    if(st>(S.run.paused||Date.now()))return alert('Le début ne peut pas être dans le futur');
    Object.assign(S.run,{start:st,client:c,note:n},pp);
  }else{
    const en=val('e-e'),p=Math.max(0,+$('e-p').value||0)*6e4;
    if(isNaN(en)||en<=st)return alert('La fin doit être après le début');
    if(p>=en-st)return alert('La pause dépasse la durée');
    const o=Object.assign({start:st,end:en,work:en-st-p,client:c,note:n},pp);
    if(E.mode==='log')Object.assign(S.logs.find(x=>x.id===E.id),o);
    else S.logs.push(Object.assign({id:Date.now().toString(36)},o));
  }
  $('dlg').close();save();render();tick();
};
$('exp').onclick=()=>{
  const q=v=>'"'+String(v||'').replace(/"/g,'""')+'"';
  const rows=['Date,Début,Fin,Heures,Client,Note',...[...S.logs].sort((a,b)=>a.start-b.start).map(l=>[dkey(l.start),new Date(l.start).toTimeString().slice(0,5),new Date(l.end).toTimeString().slice(0,5),((dur(l))/36e5).toFixed(2),q(l.client),q(l.note)].join(','))];
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv'}));a.download='heures.csv';a.click();
};
$('raw').onclick=e=>{e.preventDefault();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([localStorage.getItem(K)||localStorage.getItem(K+'.backup')||'{}'],{type:'application/json'}));a.download='heures-brut.json';a.click()};
if(bad)showErr(bad+' entrée(s) invalide(s) ignorée(s). Une copie brute est conservée.');
render();tick();setInterval(tick,1000);
document.addEventListener('visibilitychange',tick);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
